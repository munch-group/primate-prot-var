[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "primate-prot-var"
version = "0.1.1.rc1"
description = "Project description"
authors = [
    {name = "Your Name", email = "your@email.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "sgkit",
    "ipykernel",
    "pandas", 
    "numpy",
    "biopython",
    "gffutils",
    "requests", "jupyter-scatter",
]

[project.urls]
Homepage = "https://github.com/munch-group/primate-prot-var"
Repository = "https://github.com/munch-group/primate-prot-var"
Documentation = "https://munch-group.org/primate-prot-var"

[project.scripts]
primate-prot-var = "primate_prot_var:primate_prot_var"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["test*"]

[tool.setuptools.package-data]
primate_prot_var = ["data/*.txt", "data/*.csv", "data/*.pickle", "data/*.h5"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda", "munch-group"]
# platforms = ["osx-arm64", "linux-64"]
platforms = ["linux-64"] # jscatter does not work on "osx-arm64"

[tool.pixi.dependencies]
python = ">=3.8"
sgkit = "*"
gffutils = "*"
pandas = "*"
biopython = "*"
gh = "*"
git = "*"
git-lfs = "*"
tqdm = "*"
pytables = "*"
macse = "*"
seaborn = "*"
ipython = "*"
pip = "*"
notebook = "*"
pysam = "*"
geneinfo = ">=5.6.37,<6"
zstandard = "*"
vscodenb = "*"
adjusttext = "*"
jupyter-scatter = "*"
hdbscan = "*"
bcftools = "*"
pyarrow = "*"
duckdb = "*"
cyvcf2 = "*"
ensembl-vep = "*"
samtools = ">=1.21,<2"
pd-lfs = ">=0.1.33,<0.2"
