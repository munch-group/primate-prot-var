[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "primate-prot-var"
version = "0.1.1.rc1"
description = "Project description"
authors = [
    {name = "Your Name", email = "your@email.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "sgkit",
    "ipykernel",
    "pandas", 
    "numpy",
    "biopython",
    "gffutils",
]

[project.urls]
Homepage = "https://github.com/munch-group/primate-prot-var"
Repository = "https://github.com/munch-group/primate-prot-var"
Documentation = "https://munch-group.org/primate-prot-var"

[project.scripts]
primate-prot-var = "primate_prot_var:primate_prot_var"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["test*"]

[tool.setuptools.package-data]
primate_prot_var = ["data/*.txt", "data/*.csv", "data/*.pickle", "data/*.h5"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-64", "osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.8"
sgkit = "*"
gffutils = "*"
pandas = ">=2.3.2,<3"
biopython = "*"
gh = ">=2.79.0,<3"
git = ">=2.51.0,<3"
git-lfs = ">=3.7.0,<4"
tqdm = ">=4.67.1,<5"
pytables = ">=3.10.2,<4"
macse = ">=2.7,<3"
seaborn = ">=0.13.2,<0.14"
ipython = ">=9.5.0,<10"
pip = ">=25.2,<26"
notebook = ">=7.4.5,<8"
